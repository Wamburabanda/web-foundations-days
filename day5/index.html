<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day 5 - User Directory & API Design</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 30px auto; padding: 0 20px; }
        .controls { display: flex; gap: 10px; margin-bottom: 15px; }
        input { padding: 8px; flex: 1; }
        button { padding: 8px 16px; cursor: pointer; }
        ul { list-style-type: none; padding: 0; }
        li { background: #f4f4f4; margin-bottom: 8px; padding: 12px; border-radius: 4px; border: 1px solid #ddd; }
        li strong { font-size: 1.1em; }
    </style>
</head>
<body>
    <h1>User Directory</h1>

    <div class="controls">
        <button id="load-users">Load Users</button>
        <input type="text" id="filter-input" placeholder="Filter by name...">
    </div>

    <p id="status">Click "Load Users" to fetch data.</p>
    <ul id="users-list"></ul>

    <script src="users.js" defer></script>
</body>
</html>
